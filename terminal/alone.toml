# Alone Theme for Alacritty
# A warm, earthy terminal color scheme
# Compatible with Alacritty 0.12+

[colors.primary]
background = "#0C0A09"
foreground = "#C8B89A"

[colors.cursor]
text = "#0C0A09"
cursor = "#E8B850"

[colors.vi_mode_cursor]
text = "#0C0A09"
cursor = "#E8B850"

[colors.selection]
text = "#0C0A09"
background = "#D4A048"

[colors.search.matches]
foreground = "#0C0A09"
background = "#D4A048"

[colors.search.focused_match]
foreground = "#0C0A09"
background = "#E8B850"

[colors.hints.start]
foreground = "#0C0A09"
background = "#D4A048"

[colors.hints.end]
foreground = "#0C0A09"
background = "#9A8B60"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.footer_bar]
foreground = "#C8B89A"
background = "#6E665B"

[colors.normal]
black = "#0C0A09"
red = "#B85450"
green = "#9A8B60"
yellow = "#D4A048"
blue = "#9C948E"
magenta = "#A87878"
cyan = "#C08868"
white = "#C8B89A"

[colors.bright]
black = "#6E665B"
red = "#D46A66"
green = "#C4B078"
yellow = "#E8B850"
blue = "#B2AAA3"
magenta = "#C89088"
cyan = "#CEA284"
white = "#EDDCC4"

[colors.dim]
black = "#0C0A09"
red = "#8A3F3C"
green = "#746A48"
yellow = "#9F7836"
blue = "#756F6B"
magenta = "#7E5A5A"
cyan = "#90664E"
white = "#968A74"
