# Originally generated by scripts/archive/_extract-deltas.mjs; hand-maintained since v1.3.1.
# Per-variant token bindings for Alone Soft.
# Token names are mechanical paths into the theme JSON; semantic
# renaming can happen later by editing base.yaml + all variant files
# in lockstep.

display: Alone Soft
filename: alone-soft-color-theme.json
verify:
  wavelengthBand: warm
  # Soft is deliberately ~0.7× the standard's contrast (extreme dark
  # adaptation), so its APCA floors are scaled down from the verifier's
  # defaults (body 60 / syntax 40 / special 37 / punctuation 28 / comments 22).
  apcaFloors:
    body: 43
    syntax: 27
    special: 24
    punctuation: 18
    comments: 17
