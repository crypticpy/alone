# Originally generated by scripts/archive/_extract-deltas.mjs; hand-maintained since v1.3.1.
# Structural skeleton for all Alone theme variants. Leaves that vary
# across variants are written as ${token.name}; the variants/*.yaml
# files supply the per-variant bindings. Hand-edit with care: changes
# to the shape (keys, scopes, array order) propagate to every variant.

# Lets editors validate/complete the generated JSON. Excluded from the
# themes/_snapshot comparison (see themes/_snapshot/README.md).
$schema: vscode://schemas/color-theme
name: ${name}
type: dark
semanticHighlighting: true
semanticTokenColors:
  variable: ${semanticTokenColors.variable}
  variable.readonly: ${semanticTokenColors.variable.readonly}
  variable.declaration: ${semanticTokenColors.variable.declaration}
  variable.defaultLibrary:
    foreground: ${semanticTokenColors.variable.defaultLibrary.foreground}
    italic: ${style.semanticItalic}
  parameter: ${semanticTokenColors.parameter}
  property: ${semanticTokenColors.property}
  property.readonly: ${semanticTokenColors.property.readonly}
  property.declaration: ${semanticTokenColors.property.declaration}
  property.defaultLibrary:
    foreground: ${semanticTokenColors.property.defaultLibrary.foreground}
    italic: ${style.semanticItalic}
  function: ${semanticTokenColors.function}
  function.declaration: ${semanticTokenColors.function.declaration}
  function.defaultLibrary:
    foreground: ${semanticTokenColors.function.defaultLibrary.foreground}
    italic: ${style.semanticItalic}
  method: ${semanticTokenColors.method}
  method.declaration: ${semanticTokenColors.method.declaration}
  method.defaultLibrary:
    foreground: ${semanticTokenColors.method.defaultLibrary.foreground}
    italic: ${style.semanticItalic}
  class: ${semanticTokenColors.class}
  class.declaration: ${semanticTokenColors.class.declaration}
  class.defaultLibrary:
    foreground: ${semanticTokenColors.class.defaultLibrary.foreground}
    italic: ${style.semanticItalic}
  interface:
    foreground: ${semanticTokenColors.interface.foreground}
    italic: ${style.semanticItalic}
  interface.declaration:
    foreground: ${semanticTokenColors.interface.declaration.foreground}
    italic: ${style.semanticItalic}
  enum: ${semanticTokenColors.enum}
  enumMember: ${semanticTokenColors.enumMember}
  struct: ${semanticTokenColors.struct}
  type: ${semanticTokenColors.type}
  type.declaration: ${semanticTokenColors.type.declaration}
  type.defaultLibrary:
    foreground: ${semanticTokenColors.type.defaultLibrary.foreground}
    italic: ${style.semanticItalic}
  typeParameter:
    foreground: ${semanticTokenColors.typeParameter.foreground}
    italic: ${style.semanticItalic}
  namespace:
    foreground: ${semanticTokenColors.namespace.foreground}
    italic: ${style.semanticItalic}
  module:
    foreground: ${semanticTokenColors.module.foreground}
    italic: ${style.semanticItalic}
  macro: ${semanticTokenColors.macro}
  decorator: ${semanticTokenColors.decorator}
  label: ${semanticTokenColors.label}
  keyword:
    foreground: ${semanticTokenColors.keyword.foreground}
    bold: true
  comment:
    foreground: ${semanticTokenColors.comment.foreground}
    italic: ${style.semanticItalic}
  string:
    foreground: ${semanticTokenColors.string.foreground}
    italic: ${style.semanticItalic}
  number: ${semanticTokenColors.number}
  regexp:
    foreground: ${semanticTokenColors.regexp.foreground}
    italic: ${style.semanticItalic}
  operator: ${semanticTokenColors.operator}
  "*.deprecated":
    strikethrough: true
    foreground: ${semanticTokenColors.*.deprecated.foreground}
  "*.modification":
    foreground: ${semanticTokenColors.*.modification.foreground}
  "*.async":
    italic: ${style.semanticItalic}
  # ── Coverage additions (2.0.0): every selector below is bound to an existing
  #    role token so all variants inherit it and key parity is unaffected. ──
  selfParameter:
    foreground: ${tokenColors.special_variables_this_self_super.settings.foreground}
    italic: ${style.semanticItalic}
  clsParameter:
    foreground: ${tokenColors.special_variables_this_self_super.settings.foreground}
    italic: ${style.semanticItalic}
  magicFunction:
    foreground: ${tokenColors.python_magic_methods.settings.foreground}
    italic: ${style.semanticItalic}
  builtinConstant: ${tokenColors.boolean_null_constants.settings.foreground}
  boolean: ${tokenColors.boolean_null_constants.settings.foreground}
  builtinType:
    foreground: ${semanticTokenColors.type.defaultLibrary.foreground}
    italic: ${style.semanticItalic}
  lifetime:
    foreground: ${tokenColors.rust_lifetime.settings.foreground}
    italic: ${style.semanticItalic}
  attribute:
    foreground: ${tokenColors.rust_attributes.settings.foreground}
    italic: ${style.semanticItalic}
  derive:
    foreground: ${tokenColors.rust_attributes.settings.foreground}
    italic: ${style.semanticItalic}
  formatSpecifier: ${tokenColors.python_f_string_braces.settings.foreground}
  escapeSequence:
    foreground: ${tokenColors.escape_characters.settings.foreground}
    bold: true
  event: ${semanticTokenColors.property}
tokenColors:
  - name: Comments
    scope:
      - comment
      - punctuation.definition.comment
      - string.comment
    settings:
      foreground: ${tokenColors.comments.settings.foreground}
      fontStyle: ${style.italic}
  - name: Documentation Comments
    scope:
      - comment.block.documentation
      - comment.block.javadoc
      - comment.block.documentation punctuation
    settings:
      foreground: ${tokenColors.documentation_comments.settings.foreground}
      fontStyle: ${style.italic}
  - name: Strings
    scope:
      - string
      - string.quoted
      - string.template
      - punctuation.definition.string
    settings:
      foreground: ${tokenColors.strings.settings.foreground}
      fontStyle: ${style.italic}
  - name: Template String Expressions
    scope:
      - string.template punctuation.definition.template-expression
      - string.template meta.template.expression
    settings:
      foreground: ${tokenColors.template_string_expressions.settings.foreground}
      fontStyle: ""
  - name: Regular Expressions
    scope:
      - string.regexp
      - constant.other.character-class.regexp
      - punctuation.definition.character-class.regexp
    settings:
      foreground: ${tokenColors.regular_expressions.settings.foreground}
      fontStyle: ${style.italic}
  - name: Escape Characters
    scope:
      - constant.character.escape
      - constant.character.unicode
    settings:
      foreground: ${tokenColors.escape_characters.settings.foreground}
      fontStyle: bold
  - name: Numbers
    scope:
      - constant.numeric
      - constant.numeric.integer
      - constant.numeric.float
      - constant.numeric.hex
      - constant.numeric.octal
      - constant.numeric.binary
    settings:
      foreground: ${tokenColors.numbers.settings.foreground}
  - name: Boolean & Null Constants
    scope:
      - constant.language.boolean
      - constant.language.null
      - constant.language.undefined
      - constant.language.nan
    settings:
      foreground: ${tokenColors.boolean_null_constants.settings.foreground}
  - name: Language Constants
    scope:
      - constant.language
      - support.constant
    settings:
      foreground: ${tokenColors.language_constants.settings.foreground}
  - name: Other Constants
    scope:
      - constant.other
      - constant.other.symbol
    settings:
      foreground: ${tokenColors.other_constants.settings.foreground}
  - name: Keywords
    scope:
      - keyword
      - keyword.control
      - keyword.other
    settings:
      foreground: ${tokenColors.keywords.settings.foreground}
      fontStyle: bold
  - name: Control Flow Keywords
    scope:
      - keyword.control.conditional
      - keyword.control.loop
      - keyword.control.flow
      - keyword.control.trycatch
      - keyword.control.exception
    settings:
      foreground: ${tokenColors.control_flow_keywords.settings.foreground}
      fontStyle: bold
  - name: Import/Export Keywords
    scope:
      - keyword.control.import
      - keyword.control.export
      - keyword.control.from
      - keyword.control.as
    settings:
      foreground: ${tokenColors.import_export_keywords.settings.foreground}
      fontStyle: bold
  - name: Operator Keywords
    scope:
      - keyword.operator.new
      - keyword.operator.delete
      - keyword.operator.typeof
      - keyword.operator.instanceof
      - keyword.operator.in
      - keyword.operator.of
      - keyword.operator.expression
    settings:
      foreground: ${tokenColors.operator_keywords.settings.foreground}
      fontStyle: bold
  - name: Storage Keywords
    scope:
      - storage
      - storage.type
      - storage.modifier
    settings:
      foreground: ${tokenColors.storage_keywords.settings.foreground}
      fontStyle: bold
  - name: Operators
    scope:
      - keyword.operator
      - keyword.operator.arithmetic
      - keyword.operator.assignment
      - keyword.operator.comparison
      - keyword.operator.logical
      - keyword.operator.bitwise
      - keyword.operator.ternary
    settings:
      foreground: ${tokenColors.operators.settings.foreground}
      fontStyle: ""
  - name: Spread/Rest Operator
    scope:
      - keyword.operator.spread
      - keyword.operator.rest
    settings:
      foreground: ${tokenColors.spread_rest_operator.settings.foreground}
  - name: Arrow Function
    scope:
      - storage.type.function.arrow
      - keyword.operator.arrow
    settings:
      foreground: ${tokenColors.arrow_function.settings.foreground}
  - name: Functions
    scope:
      - entity.name.function
      - meta.function-call entity.name.function
      - support.function
    settings:
      foreground: ${tokenColors.functions.settings.foreground}
  - name: Function Parameters
    scope:
      - variable.parameter
      - meta.function.parameters variable
      - meta.parameter
    settings:
      foreground: ${tokenColors.function_parameters.settings.foreground}
  - name: Method Calls
    scope:
      - meta.method-call entity.name.function
      - entity.name.method
    settings:
      foreground: ${tokenColors.method_calls.settings.foreground}
  - name: Built-in Functions
    scope:
      - support.function.builtin
      - support.function.console
    settings:
      foreground: ${tokenColors.built_in_functions.settings.foreground}
  - name: Variables
    scope:
      - variable
      - variable.other
      - variable.other.readwrite
    settings:
      foreground: ${tokenColors.variables.settings.foreground}
  - name: Object Properties
    scope:
      - variable.other.property
      - variable.other.object.property
      - meta.object-literal.key
    settings:
      foreground: ${tokenColors.object_properties.settings.foreground}
  - name: Special Variables (this, self, super)
    scope:
      - variable.language.this
      - variable.language.self
      - variable.language.super
      - variable.language.special
    settings:
      foreground: ${tokenColors.special_variables_this_self_super.settings.foreground}
      fontStyle: ${style.italic}
  - name: Types & Classes
    scope:
      - entity.name.type
      - entity.name.class
      - entity.other.inherited-class
      - support.type
      - support.class
    settings:
      foreground: ${tokenColors.types_classes.settings.foreground}
  - name: Interfaces
    scope:
      - entity.name.type.interface
      - support.type.interface
    settings:
      foreground: ${tokenColors.interfaces.settings.foreground}
  - name: Type Parameters (Generics)
    scope:
      - entity.name.type.parameter
      - meta.type.parameters entity.name.type
    settings:
      foreground: ${tokenColors.type_parameters_generics.settings.foreground}
  - name: Enums
    scope:
      - entity.name.type.enum
      - support.type.enum
    settings:
      foreground: ${tokenColors.enums.settings.foreground}
  - name: Enum Members
    scope:
      - variable.other.enummember
      - constant.other.enum
    settings:
      foreground: ${tokenColors.enum_members.settings.foreground}
  - name: Namespaces & Modules
    scope:
      - entity.name.namespace
      - entity.name.module
      - entity.name.type.module
    settings:
      foreground: ${tokenColors.namespaces_modules.settings.foreground}
  - name: Decorators & Annotations
    scope:
      - meta.decorator
      - entity.name.function.decorator
      - punctuation.decorator
    settings:
      foreground: ${tokenColors.decorators_annotations.settings.foreground}
      fontStyle: ${style.italic}
  - name: Punctuation
    scope:
      - punctuation
      - punctuation.separator
      - punctuation.terminator
      - punctuation.accessor
      - meta.brace
    settings:
      foreground: ${tokenColors.punctuation.settings.foreground}
  - name: Brackets
    scope:
      - punctuation.definition.block
      - punctuation.section.block
      - punctuation.definition.parameters
      - punctuation.section.parameters
      - punctuation.definition.array
      - punctuation.section.array
      - punctuation.definition.arguments
      - punctuation.section.arguments
    settings:
      foreground: ${tokenColors.brackets.settings.foreground}
  - name: HTML/XML Tags
    scope:
      - entity.name.tag
      - punctuation.definition.tag
    settings:
      foreground: ${tokenColors.html_xml_tags.settings.foreground}
  - name: HTML/XML Attributes
    scope:
      - entity.other.attribute-name
    settings:
      foreground: ${tokenColors.html_xml_attributes.settings.foreground}
  - name: HTML Attribute Values
    scope:
      - string.quoted.double.html
      - string.quoted.single.html
      - meta.attribute-with-value string
    settings:
      foreground: ${tokenColors.html_attribute_values.settings.foreground}
      fontStyle: ${style.italic}
  - name: HTML Entities
    scope:
      - constant.character.entity
      - punctuation.definition.entity
    settings:
      foreground: ${tokenColors.html_entities.settings.foreground}
  - name: JSX Component Tags
    scope:
      - support.class.component
      - entity.name.tag.jsx
      - entity.name.tag support.class.component
    settings:
      foreground: ${tokenColors.jsx_component_tags.settings.foreground}
  - name: JSX Expression Braces
    scope:
      - punctuation.section.embedded.begin.jsx
      - punctuation.section.embedded.end.jsx
    settings:
      foreground: ${tokenColors.jsx_expression_braces.settings.foreground}
  - name: JSX Spread Attributes
    scope:
      - keyword.operator.spread.jsx
    settings:
      foreground: ${tokenColors.jsx_spread_attributes.settings.foreground}
  - name: CSS Selectors
    scope:
      - entity.other.attribute-name.class.css
      - entity.other.attribute-name.id.css
    settings:
      foreground: ${tokenColors.css_selectors.settings.foreground}
  - name: CSS Properties
    scope:
      - support.type.property-name.css
      - meta.property-name.css
    settings:
      foreground: ${tokenColors.css_properties.settings.foreground}
  - name: CSS Property Values
    scope:
      - support.constant.property-value.css
      - meta.property-value.css
    settings:
      foreground: ${tokenColors.css_property_values.settings.foreground}
  - name: CSS Units
    scope:
      - keyword.other.unit.css
    settings:
      foreground: ${tokenColors.css_units.settings.foreground}
  - name: CSS Functions
    scope:
      - support.function.misc.css
      - support.function.transform.css
      - support.function.calc.css
    settings:
      foreground: ${tokenColors.css_functions.settings.foreground}
  - name: CSS Pseudo-elements/classes
    scope:
      - entity.other.attribute-name.pseudo-element.css
      - entity.other.attribute-name.pseudo-class.css
    settings:
      foreground: ${tokenColors.css_pseudo_elements_classes.settings.foreground}
  - name: CSS Variables
    scope:
      - variable.css
      - variable.argument.css
      - support.type.custom-property.css
    settings:
      foreground: ${tokenColors.css_variables.settings.foreground}
  - name: JSON Property Names
    scope:
      - support.type.property-name.json
      - punctuation.support.type.property-name.json
    settings:
      foreground: ${tokenColors.json_property_names.settings.foreground}
  - name: JSON String Values
    scope:
      - string.quoted.double.json
    settings:
      foreground: ${tokenColors.json_string_values.settings.foreground}
      fontStyle: ${style.italic}
  - name: YAML Keys
    scope:
      - entity.name.tag.yaml
    settings:
      foreground: ${tokenColors.yaml_keys.settings.foreground}
  - name: YAML Values
    scope:
      - string.unquoted.yaml
      - string.quoted.single.yaml
      - string.quoted.double.yaml
    settings:
      foreground: ${tokenColors.yaml_values.settings.foreground}
      fontStyle: ${style.italic}
  - name: YAML Anchors & Aliases
    scope:
      - entity.name.type.anchor.yaml
      - variable.other.alias.yaml
    settings:
      foreground: ${tokenColors.yaml_anchors_aliases.settings.foreground}
  - name: Markdown Headings
    scope:
      - markup.heading
      - entity.name.section.markdown
      - punctuation.definition.heading.markdown
    settings:
      foreground: ${tokenColors.markdown_headings.settings.foreground}
      fontStyle: bold
  - name: Markdown Bold
    scope:
      - markup.bold
      - punctuation.definition.bold.markdown
    settings:
      foreground: ${tokenColors.markdown_bold.settings.foreground}
      fontStyle: bold
  - name: Markdown Italic
    scope:
      - markup.italic
      - punctuation.definition.italic.markdown
    settings:
      foreground: ${tokenColors.markdown_italic.settings.foreground}
      fontStyle: italic
  - name: Markdown Code
    scope:
      - markup.inline.raw
      - markup.fenced_code
      - punctuation.definition.raw.markdown
    settings:
      foreground: ${tokenColors.markdown_code.settings.foreground}
  - name: Markdown Links
    scope:
      - markup.underline.link
      - string.other.link.title.markdown
      - string.other.link.description.markdown
    settings:
      foreground: ${tokenColors.markdown_links.settings.foreground}
  - name: Markdown List Markers
    scope:
      - punctuation.definition.list.begin.markdown
    settings:
      foreground: ${tokenColors.markdown_list_markers.settings.foreground}
  - name: Markdown Block Quote
    scope:
      - markup.quote.markdown
      - punctuation.definition.quote.begin.markdown
    settings:
      foreground: ${tokenColors.markdown_block_quote.settings.foreground}
      fontStyle: ${style.italic}
  - name: Python Docstrings
    scope:
      - string.quoted.docstring.multi.python
      - string.quoted.docstring.single.python
    settings:
      foreground: ${tokenColors.python_docstrings.settings.foreground}
      fontStyle: ${style.italic}
  - name: Python F-string Braces
    scope:
      - constant.character.format.placeholder.other.python
    settings:
      foreground: ${tokenColors.python_f_string_braces.settings.foreground}
  - name: Python Magic Methods
    scope:
      - support.function.magic.python
    settings:
      foreground: ${tokenColors.python_magic_methods.settings.foreground}
      fontStyle: ${style.italic}
  - name: Python Builtins
    scope:
      - support.function.builtin.python
      - support.type.python
    settings:
      foreground: ${tokenColors.python_builtins.settings.foreground}
  - name: Rust Lifetime
    scope:
      - storage.modifier.lifetime.rust
      - entity.name.type.lifetime.rust
    settings:
      foreground: ${tokenColors.rust_lifetime.settings.foreground}
      fontStyle: ${style.italic}
  - name: Rust Macros
    scope:
      - entity.name.function.macro.rust
      - support.macro.rust
    settings:
      foreground: ${tokenColors.rust_macros.settings.foreground}
      fontStyle: bold
  - name: Rust Attributes
    scope:
      - meta.attribute.rust
    settings:
      foreground: ${tokenColors.rust_attributes.settings.foreground}
      fontStyle: ${style.italic}
  - name: Go Package Names
    scope:
      - entity.name.package.go
    settings:
      foreground: ${tokenColors.go_package_names.settings.foreground}
  - name: Shell Commands
    scope:
      - support.function.builtin.shell
      - entity.name.command.shell
    settings:
      foreground: ${tokenColors.shell_commands.settings.foreground}
  - name: Shell Variables
    scope:
      - variable.other.normal.shell
      - punctuation.definition.variable.shell
    settings:
      foreground: ${tokenColors.shell_variables.settings.foreground}
  - name: SQL Keywords
    scope:
      - keyword.other.sql
      - keyword.other.DML.sql
      - keyword.other.DDL.sql
    settings:
      foreground: ${tokenColors.sql_keywords.settings.foreground}
      fontStyle: bold
  - name: Invalid Illegal
    scope:
      - invalid.illegal
    settings:
      foreground: ${tokenColors.invalid_illegal.settings.foreground}
      fontStyle: bold underline
  - name: Invalid Deprecated
    scope:
      - invalid.deprecated
    settings:
      foreground: ${tokenColors.invalid_deprecated.settings.foreground}
      fontStyle: strikethrough
  # ── Coverage additions (2.0.0): diffs, logs, preprocessor, constants,
  #    labels, strikethrough, support variables. All bound to existing tokens. ──
  - name: Diff Inserted
    scope:
      - markup.inserted
      - markup.inserted.diff
      - punctuation.definition.inserted.diff
    settings:
      foreground: ${colors.gitDecoration.addedResourceForeground}
  - name: Diff Deleted
    scope:
      - markup.deleted
      - markup.deleted.diff
      - punctuation.definition.deleted.diff
    settings:
      foreground: ${colors.gitDecoration.deletedResourceForeground}
  - name: Diff Changed
    scope:
      - markup.changed
      - markup.changed.diff
      - punctuation.definition.changed.diff
    settings:
      foreground: ${colors.gitDecoration.modifiedResourceForeground}
  - name: Diff Headers
    scope:
      - meta.diff.header
      - meta.diff.header.from-file
      - meta.diff.header.to-file
      - meta.diff.index
      - punctuation.definition.from-file.diff
      - punctuation.definition.to-file.diff
    settings:
      foreground: ${tokenColors.documentation_comments.settings.foreground}
  - name: Diff Ranges
    scope:
      - meta.diff.range
      - punctuation.definition.range.diff
    settings:
      foreground: ${tokenColors.keywords.settings.foreground}
      fontStyle: ""
  - name: Log Info
    scope:
      - token.info-token
    settings:
      foreground: ${colors.debugConsole.infoForeground}
  - name: Log Warning
    scope:
      - token.warn-token
    settings:
      foreground: ${colors.debugConsole.warningForeground}
  - name: Log Error
    scope:
      - token.error-token
    settings:
      foreground: ${colors.debugConsole.errorForeground}
      fontStyle: bold
  - name: Log Debug
    scope:
      - token.debug-token
    settings:
      foreground: ${colors.debugConsole.sourceForeground}
  - name: Preprocessor Directives
    scope:
      - keyword.control.directive
      - punctuation.definition.directive
    settings:
      foreground: ${tokenColors.keywords.settings.foreground}
      fontStyle: bold
  - name: Preprocessor Macros
    scope:
      - entity.name.function.preprocessor
      - entity.name.function.macro
    settings:
      foreground: ${tokenColors.rust_macros.settings.foreground}
      fontStyle: bold
  - name: Constants (ALL_CAPS)
    scope:
      - variable.other.constant
      - constant.other.caps
      - variable.other.enummember
    settings:
      foreground: ${tokenColors.other_constants.settings.foreground}
  - name: Labels
    scope:
      - entity.name.label
      - entity.name.goto-label
    settings:
      foreground: ${semanticTokenColors.label}
  - name: Markdown Strikethrough
    scope:
      - markup.strikethrough
      - punctuation.definition.strikethrough.markdown
    settings:
      foreground: ${tokenColors.invalid_deprecated.settings.foreground}
      fontStyle: strikethrough
  - name: Support Variables (globals, DOM)
    scope:
      - support.variable
      - support.variable.property
      - support.variable.dom
      - support.variable.object.process
    settings:
      foreground: ${semanticTokenColors.variable.defaultLibrary.foreground}
      fontStyle: ${style.italic}
colors:
  foreground: ${colors.foreground}
  disabledForeground: ${colors.disabledForeground}
  focusBorder: ${colors.focusBorder}
  selection.background: ${colors.selection.background}
  descriptionForeground: ${colors.descriptionForeground}
  errorForeground: ${colors.errorForeground}
  icon.foreground: ${colors.icon.foreground}
  sash.hoverBorder: ${colors.sash.hoverBorder}
  textLink.foreground: ${colors.textLink.foreground}
  textLink.activeForeground: ${colors.textLink.activeForeground}
  textBlockQuote.background: ${colors.textBlockQuote.background}
  textBlockQuote.border: ${colors.textBlockQuote.border}
  textCodeBlock.background: ${colors.textCodeBlock.background}
  textPreformat.foreground: ${colors.textPreformat.foreground}
